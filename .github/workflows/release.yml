name: Release

# Tag vX.Y.Z (must match [workspace.package].version) to build `redact`
# archives and publish them on the GitHub Release. Default build only
# (no OCR feature) so the matrix stays portable and matches CI.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match Cargo.toml version
        id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(awk '
            $0 == "[workspace.package]" { p=1; next }
            p && /^\[/ { exit }
            p && $1 == "version" {
              v=$3
              gsub(/"/, "", v)
              print v
              exit
            }
          ' Cargo.toml)"
          if [[ -z "$cargo_version" ]]; then
            echo "workspace.package version not found in Cargo.toml" >&2
            exit 1
          fi
          if [[ "$tag" != "$cargo_version" ]]; then
            echo "tag v$tag does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            cross: false
            apt: ""
            linker: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
            apt: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            cross: false
            apt: ""
            linker: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            cross: false
            apt: ""
            linker: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            cross: false
            apt: ""
            linker: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml pin)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-targets: false

      - name: Install cross linker
        if: ${{ matrix.apt }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Build
        shell: bash
        env:
          LINKER: ${{ matrix.linker }}
        run: |
          set -euo pipefail
          if [[ -n "${LINKER:-}" ]]; then
            triple="$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')"
            export "CARGO_TARGET_${triple}_LINKER=$LINKER"
          fi
          cargo build -p redact-cli --release --locked --target ${{ matrix.target }}

      - name: Smoke-test binary
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/redact"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            bin="${bin}.exe"
          fi
          "$bin" --version
          "$bin" --help >/dev/null
          "$bin" --version | grep -F "${{ needs.version.outputs.version }}"

      - name: Check cross-compiled ELF
        if: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/redact"
          test -x "$bin"
          file "$bin"
          file "$bin" | grep -Ei 'aarch64|ARM aarch64'

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          bin="redact"
          if [[ "$TARGET" == *windows* ]]; then
            bin="redact.exe"
          fi
          src="target/${TARGET}/release/${bin}"
          test -f "$src"
          stage="redact-${VERSION}-${TARGET}"
          mkdir -p "dist/${stage}"
          cp "$src" "dist/${stage}/"
          cp LICENSE README.md "dist/${stage}/"
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" .github/scripts/package-release.py "$ARCHIVE" "dist/${stage}" "dist/${stage}.${ARCHIVE}"
          rm -rf "dist/${stage}"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: redact-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * | tee SHA256SUMS
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: redact ${{ needs.version.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Prebuilt `redact` binaries for Linux, macOS, and Windows.

            Each archive contains the `redact` executable, `LICENSE`, and `README.md`.
            Verify downloads against `SHA256SUMS`.

            These are **default** builds (no OCR). For scanned PDFs, build from source:

            ```
            cargo build -p redact-cli --release --features ocr --locked
            ```

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=$(find dist -type f | wc -l | tr -d ' ')
          uploaded=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')
          echo "expected=$expected uploaded=$uploaded"
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
          if [[ "$uploaded" -ne "$expected" ]]; then
            echo "asset count mismatch" >&2
            exit 1
          fi
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS
